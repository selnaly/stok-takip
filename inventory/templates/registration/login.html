<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-kutu {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .hata {
            color: #b00020;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-kutu">

    <h1>Stok Takip Sistemi</h1>

    <p>Devam etmek için giriş yapın.</p>

    {% if form.errors %}
        <div class="hata">
            Kullanıcı adı veya şifre hatalı.
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Giriş Yap
        </button>

    </form>

</div>

</body>

</html>
