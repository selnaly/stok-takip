<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeni Ürün Ekle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 30px;
        }

        .form-kutu {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .geri {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="form-kutu">

    <h1>Yeni Ürün Ekle</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Ürünü Kaydet
        </button>

    </form>

    <a class="geri" href="{% url 'urun_listesi' %}">
        ← Stok listesine dön
    </a>

</div>

</body>
</html>
